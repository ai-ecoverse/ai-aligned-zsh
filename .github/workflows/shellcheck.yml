name: ShellCheck

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Run ShellCheck
      uses: ludeeus/action-shellcheck@2.0.0
      with:
        check_together: 'yes'
        severity: warning
        # ShellCheck does not read zsh; zsh -n checks it below.
        ignore_names: executable_ai-aligned-zsh

    - name: Check the zsh hook parses
      run: |
        sudo apt-get update && sudo apt-get install -y zsh
        zsh -n executable_ai-aligned-zsh

    - name: Check install.sh is POSIX sh
      run: dash -n install.sh

    - name: Verify scripts are executable
      run: |
        test -x executable_ai-aligned-zsh || (echo "executable_ai-aligned-zsh is not executable" && exit 1)
        test -x install.sh || (echo "install.sh is not executable" && exit 1)
        test -x test.sh || (echo "test.sh is not executable" && exit 1)
